# ARC Research Console — standalone deployment.
#
# One image (UI + BFF). Its only dependency is a reachable arc-model-lab, given
# as a URL. Every other ARC service is run and deployed on its own, from its own
# repo; this file knows nothing about how to build them.
#
#   cp deploy/.env.example deploy/.env     # set MODEL_LAB_URL
#   make up                                # or: cd deploy && docker compose up --build

name: arc-platform

services:
  arc-platform:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: arc-platform:latest
    container_name: arc-platform
    environment:
      # Where arc-model-lab is reachable FROM the container. Read from
      # deploy/.env (or the shell); falls back to a model lab on the host.
      MODEL_LAB_URL: ${MODEL_LAB_URL:-http://host.docker.internal:8000}
      MODEL_LAB_TIMEOUT_MS: ${MODEL_LAB_TIMEOUT_MS:-15000}
      MODEL_LAB_INFERENCE_TIMEOUT_MS: ${MODEL_LAB_INFERENCE_TIMEOUT_MS:-120000}
    ports:
      - "3000:3000"
    # Lets the container reach a model lab bound to the host on Linux too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
