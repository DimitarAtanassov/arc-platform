[project]
name = "arc-platform"
version = "0.1.0"
description = "Product surface for the ARC Research Console: a BFF + UI for model discovery and inference over arc-model-lab."
readme = "README.md"
authors = [
    { name = "DimitarAtanassov", email = "dimitar789558@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "anyio>=4.6.0",
    "httpx>=0.27.0",
    "arc-telemetry",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/arc_platform"]

[tool.uv]
native-tls = true
default-groups = ["dev", "lint"]

# arc-telemetry is the shared observability SDK, published as a standalone
# public repo. We resolve it from Git so CI, Docker, and fresh clones all build
# without a sibling checkout. For local cross-repo development against a live
# editable checkout, override this source in a personal uv.toml. See arc-docs
# running-the-stack.md.
[tool.uv.sources]
arc-telemetry = { git = "https://github.com/DimitarAtanassov/arc-telemetry.git", branch = "main" }

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=6.0.0",
    "coverage>=7.8.0",
    "anyio>=4.6.0",
    "respx>=0.21.0",
    "pytest-env>=1.0.0",
]

lint = [
    "mypy>=1.19.1",
    "ruff>=0.14.10",
    "pre-commit>=4.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
addopts = "-ra --strict-markers"
env = [
    "ARC_OTEL_ENABLE_OTLP=false",
    "ARC_PLATFORM_LOG_LEVEL=WARNING",
]

markers = [
    "unit: fast service-layer tests with no external dependencies",
    "integration: API tests exercised via httpx AsyncClient",
    "contract: ModelLabClient wire-contract tests via respx",
    "e2e: full browser -> BFF -> arc-model-lab flow (mocked downstream)",
]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
explicit_package_bases = true
mypy_path = ["backend/src"]

# arc-telemetry is an optional, private SDK resolved from Git. The telemetry seam
# (core/telemetry.py) degrades gracefully when it is absent, so type-checking must
# not require it to be installed.
[[tool.mypy.overrides]]
module = ["arc_telemetry.*"]
ignore_missing_imports = true

[tool.ruff]
indent-width = 4
target-version = "py313"
src = ["backend/src", "backend/tests"]

[tool.ruff.lint]
select = [
    "F","E","W","C90","I","N","UP","YTT","ANN","ASYNC",
    "S","BLE","B","A","C4","PT","PL","PERF","RUF"
]

ignore = [
    "PLR2004",
    "E501",
]

[tool.ruff.lint.pylint]
max-args = 8

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = ["S101", "ANN", "PLR2004", "INP001", "PLR0915"]

[tool.coverage.run]
source = ["backend/src"]
branch = true
omit = ["*/cli/*", "*/__main__.py"]

[tool.coverage.report]
precision = 2
show_missing = true
fail_under = 80
