[project]
name = "arc-platform"
version = "0.1.0"
description = "Product surface for the ARC AI control plane: a BFF + UI for trace, request and evaluation visualization."
readme = "README.md"
authors = [
    { name = "DimitarAtanassov", email = "dimitar789558@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "anyio>=4.6.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/arc_platform"]

[tool.uv.workspace]
members = ["apps/*", "packages/*"]
exclude = ["apps/web"]

[tool.uv]
native-tls = true
default-groups = ["dev", "lint"]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=6.0.0",
    "anyio>=4.6.0",
    "testcontainers>=4.9.0",
    "psycopg[binary]>=3.2.0",
]

lint = [
    "mypy>=1.19.1",
    "ruff>=0.14.10",
    "pre-commit>=4.0.0",
]

test = [
    "coverage>=7.8.0",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.1",
    "pytest-httpserver>=1.1.3",
    "pytest-mock>=3.14.0",
    "respx>=0.22.0",
    "pytest-env>=1.0.0",
    "testcontainers[postgres]>=4.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
addopts = "-ra --strict-markers"

markers = [
    "unit: fast service-layer tests with no external dependencies",
    "integration: API tests exercised via httpx AsyncClient",
    "e2e: full request -> trace -> response flow (mocked)",
]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
explicit_package_bases = true
mypy_path = ["backend/src"]

[[tool.mypy.overrides]]
module = ["testcontainers.*", "respx.*"]
ignore_missing_imports = true

[tool.ruff]
indent-width = 4
target-version = "py313"
src = ["backend/src", "backend/tests"]

[tool.ruff.lint]
select = [
    "F","E","W","C90","I","N","UP","YTT","ANN","ASYNC",
    "S","BLE","B","A","C4","PT","PL","PERF","RUF"
]

ignore = [
    "PLR2004",
    "E501",
]

[tool.ruff.lint.pylint]
max-args = 8

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = ["S101", "ANN", "PLR2004", "INP001", "PLR0915"]

[tool.coverage.run]
source = ["backend/src"]
branch = true
omit = ["*/cli/*", "*/__main__.py"]

[tool.coverage.report]
precision = 2
show_missing = true
fail_under = 80
